# Refraction Studio local test environment (NOT for production). Start with testenv/start.sh.
#   50020  Refraction Studio in the browser (noVNC)
#   50021  Files: test data, your uploads, reports and exports written by the app (login: tester)
# Both ports listen on 127.0.0.1 only; reach them through an SSH tunnel, or start with
# "start.sh --public" for two Cloudflare quick-tunnel HTTPS addresses usable from any network.
# The VNC and file-browser passwords are generated by start.sh into testenv/.env (git-ignored).
name: rfs-testenv

services:
  app:
    build:
      context: ../artifacts/testenv-build
      dockerfile: testenv/app/Dockerfile
    image: rfs-testenv-app:local
    restart: unless-stopped
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?run testenv/start.sh}
      SCREEN: ${SCREEN:-1680x1050}
    volumes:
      - ./workspace/Files:/home/tester/Files
      - ./workspace/appdata:/home/tester/.refraction-studio
    ports: ["127.0.0.1:50020:6080"]
    shm_size: 256m

  files:
    image: filebrowser/filebrowser:v2.32.0
    restart: unless-stopped
    user: "1000:1000"
    command: ["--root", "/srv", "--address", "0.0.0.0", "--port", "8080", "--database", "/database/filebrowser.db"]
    volumes:
      - ./workspace/Files:/srv
      - ./workspace/filebrowser:/database
    ports: ["127.0.0.1:50021:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s

  # Public HTTPS addresses (profile "public"): Cloudflare quick tunnels, no account or open ports needed.
  tunnel-app:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:6080"]

  tunnel-files:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://files:8080"]
